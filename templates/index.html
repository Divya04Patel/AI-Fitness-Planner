<!DOCTYPE html>
<html>
<head>
    <title>AI-Based Professional Fitness Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>AI-Based Professional Fitness Planner</h2>

    <form method="POST">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        
        <label for="age">Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required>
        
        <label for="height">Height (cm)</label>
        <input type="number" id="height" name="height" placeholder="Enter your height in cm" required>
        
        <label for="weight">Weight (kg)</label>
        <input type="number" id="weight" name="weight" placeholder="Enter your weight in kg" required>

        <button type="submit">Get My Plan</button>
    </form>
</div>
</body>
</html>
