<!DOCTYPE html>
<html>
<head>
    <title>Your Fitness Plan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="left-section">
        <img src="https://img.icons8.com/color/64/000000/user.png" alt="User Icon" class="user-icon">
        <h2>Hello {{ name }}👋</h2>
        <p><strong>Your BMI:</strong> {{ bmi }}</p>
        <p><strong>BMI Category:</strong> {{ category }}</p>
        <p><strong>Fitness Goal:</strong> {{ goal }}</p>
            <div class="bottom-section">
        <p><strong>Daily Calories:</strong> {{ calories }}</p>
        <a href="/">← Back</a>
    </div>
    </div>
    <div class="right-section">
        <div class="plan-section">
            <p><img src="https://img.icons8.com/color/24/000000/dumbbell.png" alt="Workout" class="section-icon"><strong>Workout Plan:</strong></p>
            <ul>
                {% for w in workout %}
                    <li>{{ w }}</li>
                {% endfor %}
            </ul>
        </div>
        <div class="plan-section">
            <p><img src="https://img.icons8.com/color/24/000000/apple.png" alt="Diet" class="section-icon"><strong>Diet Plan:</strong></p>
            <ul>
                {% for d in diet %}
                    <li>{{ d }}</li>
                {% endfor %}
            </ul>
        </div>
    </div>

</div>
</body>
</html>
